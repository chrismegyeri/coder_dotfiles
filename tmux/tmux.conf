# tmux config — Catppuccin Mocha. Managed by GNU Stow (~/.dotfiles/tmux).
#
# Model: ONE Ghostty window, many persistent tmux sessions. Close Ghostty and
# everything keeps running; reopen and zsh re-attaches to "main". Sessions also
# survive reboots via tmux-resurrect + tmux-continuum.
#
# Cheat sheet: F1 / Alt+/  (or prefix + ?)   Session switcher: Alt+s  (or prefix + s)

# --- Core -------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind -N "Send the prefix key through to the app" C-a send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB:hyperlinks:extkeys"
set -g extended-keys on
set -g allow-passthrough on          # lets Ghostty handle images / OSC passthrough
set -g set-clipboard on              # yank -> system clipboard via OSC 52
set -g focus-events on
set -g mouse on
set -g escape-time 0
set -g history-limit 50000
set -g base-index 1                  # windows start at 1 (matches Alt+1..9)
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off         # killing a session jumps to another, not out
set -g mode-keys vi
set -g status-keys emacs
set -g aggressive-resize on
set -g display-time 2000

bind -N "Reload tmux config" r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# --- Splits (new panes inherit the current directory) ------------------------
unbind '"'
unbind %
bind -N "Split right"            | split-window -h -c "#{pane_current_path}"
bind -N "Split down"             - split-window -v -c "#{pane_current_path}"
bind -N "Split right (full height)" '\' split-window -fh -c "#{pane_current_path}"
bind -N "Split down (full width)"   _ split-window -fv -c "#{pane_current_path}"
bind -N "New window (current dir)"  c new-window -c "#{pane_current_path}"

# --- Panes ------------------------------------------------------------------
bind -N "Focus pane left"  h select-pane -L
bind -N "Focus pane down"  j select-pane -D
bind -N "Focus pane up"    k select-pane -U
bind -N "Focus pane right" l select-pane -R
bind -r -N "Resize pane left"  H resize-pane -L 5
bind -r -N "Resize pane down"  J resize-pane -D 5
bind -r -N "Resize pane up"    K resize-pane -U 5
bind -r -N "Resize pane right" L resize-pane -R 5
bind -r -N "Swap window left"  < swap-window -d -t -1
bind -r -N "Swap window right" > swap-window -d -t +1
bind -N "Scratch terminal popup (current dir)" g \
  display-popup -E -w 85% -h 85% -b rounded -d "#{pane_current_path}" "$SHELL"

# --- Sessions: switch / create / kill (all within the one Ghostty window) -----
bind -N "Session switcher / creator (fzf popup)" s \
  display-popup -E -w 60% -h 60% -b rounded -T " sessions " "$HOME/.local/bin/tmux-sessions"
bind -N "New session (prompt for name)" S \
  command-prompt -p "New session name:" "new-session -s '%%'"
bind -N "Kill current session (confirm)" X \
  confirm-before -p "Kill session #S? (y/n)" kill-session
bind -N "Jump to last session" Tab switch-client -l
bind -N "Rename session" '$' command-prompt -I "#S" "rename-session '%%'"

# --- Help popup ---------------------------------------------------------------
bind -N "Keybinding cheat sheet (tmux + Ghostty)" ? \
  display-popup -E -w 80% -h 80% -b rounded -T " keybindings " "$HOME/.local/bin/tmux-keys"

# --- Copy mode (vi) ------------------------------------------------------------
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# --- No-prefix shortcuts (Alt = fast path) -------------------------------------
bind -n -N "Focus pane left"  M-h select-pane -L
bind -n -N "Focus pane down"  M-j select-pane -D
bind -n -N "Focus pane up"    M-k select-pane -U
bind -n -N "Focus pane right" M-l select-pane -R
bind -n -N "Split right" M-'\' split-window -h -c "#{pane_current_path}"
bind -n -N "Split down"  M-'-' split-window -v -c "#{pane_current_path}"
bind -n -N "Toggle pane zoom" M-z resize-pane -Z
bind -n -N "New window (current dir)" M-t new-window -c "#{pane_current_path}"
bind -n -N "Next window"     M-n next-window
bind -n -N "Previous window" M-p previous-window
bind -n -N "Session switcher / creator (fzf popup)" M-s \
  display-popup -E -w 60% -h 60% -b rounded -T " sessions " "$HOME/.local/bin/tmux-sessions"
bind -n -N "Keybinding cheat sheet (tmux + Ghostty)" M-? \
  display-popup -E -w 80% -h 80% -b rounded -T " keybindings " "$HOME/.local/bin/tmux-keys"
bind -n -N "Keybinding cheat sheet (tmux + Ghostty)" M-/ \
  display-popup -E -w 80% -h 80% -b rounded -T " keybindings " "$HOME/.local/bin/tmux-keys"
bind -n -N "Keybinding cheat sheet (tmux + Ghostty)" F1 \
  display-popup -E -w 80% -h 80% -b rounded -T " keybindings " "$HOME/.local/bin/tmux-keys"
bind -n -N "Jump to window 1" M-1 select-window -t 1
bind -n -N "Jump to window 2" M-2 select-window -t 2
bind -n -N "Jump to window 3" M-3 select-window -t 3
bind -n -N "Jump to window 4" M-4 select-window -t 4
bind -n -N "Jump to window 5" M-5 select-window -t 5
bind -n -N "Jump to window 6" M-6 select-window -t 6
bind -n -N "Jump to window 7" M-7 select-window -t 7
bind -n -N "Jump to window 8" M-8 select-window -t 8
bind -n -N "Jump to window 9" M-9 select-window -t 9

# --- Theme: Catppuccin Mocha ---------------------------------------------------
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_status_background "default"
set -g @catppuccin_pane_border_status "off"

set -g status-position top
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
# Red PREFIX pill while tmux is waiting for the key after Ctrl-a
set -g status-left "#{?client_prefix,#[bg=#f38ba8 fg=#1e1e2e bold] PREFIX #[default] ,}"
set -g status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -g @catppuccin_date_time_text " %a %H:%M"

# --- Persistence ---------------------------------------------------------------
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-strategy-nvim "session"
set -g @continuum-restore "on"       # auto-restore last save when the server starts
set -g @continuum-save-interval "10"

# --- Plugins (TPM) — clones live outside the stowed tree ------------------------
# Install: prefix + I   (install.sh does this for you)
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "catppuccin/tmux#v2.1.3"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"   # keep last
if "test -x $HOME/.local/share/tmux/plugins/tpm/tpm" \
   "run '$HOME/.local/share/tmux/plugins/tpm/tpm'"
